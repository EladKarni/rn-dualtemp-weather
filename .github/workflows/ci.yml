name: CI

# Every branch, not just main. Release work happens on a branch, so gating only
# main meant the branches where the gate matters most were never checked.
on:
  push:
  pull_request:

jobs:
  gate:
    name: Green gate (tsc + eslint + jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run gate
        run: yarn gate
